<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyGraph - AI 知识图谱助手</title>
    <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
    <!-- ============ 顶部栏 ============ -->
    <header class="top-bar">
        <h1>🧠 HyGraph - AI 知识图谱助手</h1>
        <div class="topic-input-area">
            <input
                id="topicInput"
                type="text"
                placeholder="输入知识主题，如：Transformer、人工智能、计算机网络..."
            />
            <button id="generateBtn">生成知识图谱</button>
            <button id="saveBtn" class="btn-save" disabled>💾 保存</button>
            <button id="historyBtn" class="btn-history">📋 历史</button>
            <button id="exportPngBtn" class="btn-history" disabled>🖼 PNG</button>
            <button id="exportJsonBtn" class="btn-history" disabled>⬇ JSON</button>
        </div>
    </header>

    <!-- ============ 主体区域 ============ -->
    <main class="main-area">
        <!-- 左侧：知识图谱画布 -->
        <section class="graph-panel">
            <div id="graphChart" class="chart-container">
                <p class="placeholder-text">👆 在上方输入知识主题，点击"生成知识图谱"开始探索</p>
            </div>
        </section>

        <!-- 右侧：知识问答区 -->
        <section class="chat-panel">
            <div class="chat-header">💬 知识问答</div>
            <div id="chatMessages" class="chat-messages">
                <p class="placeholder-text">生成图谱后可在此提问</p>
            </div>
            <div class="chat-input-area">
                <input id="chatInput" type="text" placeholder="基于图谱内容提问...">
                <button id="sendBtn">发送</button>
            </div>
        </section>
    </main>

    <!-- ============ 历史记录弹窗 ============ -->
    <div id="historyModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>📋 已保存的图谱</h3>
                <button id="closeHistoryBtn" class="btn-close">✕</button>
            </div>
            <div id="historyList" class="history-list">
                <p class="history-empty">暂无保存记录</p>
            </div>
        </div>
    </div>

    <!-- ============ JS 脚本 ============ -->
    <script src="/app.js?v=9"></script>
</body>
</html>
